<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Strayd persistent configuration</title>
  <desc id="desc">A terminal shows how to initialize Strayd configuration and hide sshd on port 22 with a generic visibility rule.</desc>
  <rect width="1200" height="600" rx="24" fill="#070b12"/>
  <rect x="22" y="22" width="1156" height="556" rx="15" fill="#0b1019" stroke="#354050"/>
  <circle cx="54" cy="52" r="7" fill="#ff657c"/><circle cx="79" cy="52" r="7" fill="#f7be4d"/><circle cx="104" cy="52" r="7" fill="#3dd6d0"/>
  <text x="600" y="58" text-anchor="middle" fill="#758097" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">strayd — config.toml</text>
  <line x1="22" y1="80" x2="1178" y2="80" stroke="#354050"/>

  <text x="52" y="126" fill="#3dd6d0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">$</text>
  <text x="80" y="126" fill="#f7f9fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">strayd config init</text>
  <text x="52" y="158" fill="#758097" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Created ~/.config/strayd/config.toml</text>

  <text x="52" y="212" fill="#f7be4d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16"># Rules are ORed; fields inside one rule are ANDed.</text>
  <text x="52" y="246" fill="#ab72ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">version</text>
  <text x="152" y="246" fill="#758097" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">=</text>
  <text x="180" y="246" fill="#3dd6d0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">1</text>

  <text x="52" y="304" fill="#ab72ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">[[display.hide]]</text>
  <text x="52" y="340" fill="#f7f9fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">ports</text>
  <text x="152" y="340" fill="#758097" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">=</text>
  <text x="180" y="340" fill="#3dd6d0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">[22]</text>
  <text x="52" y="376" fill="#f7f9fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">runtimes</text>
  <text x="152" y="376" fill="#758097" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">=</text>
  <text x="180" y="376" fill="#3dd6d0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">["sshd"]</text>

  <text x="52" y="432" fill="#f7be4d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16"># Match any resource by kind, platform, process, project, command or id.</text>
  <text x="52" y="480" fill="#3dd6d0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">$</text>
  <text x="80" y="480" fill="#f7f9fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">strayd</text>
  <text x="52" y="526" fill="#758097" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">3 groups / 4 resources · scan ready · 1 hidden by config</text>
</svg>
