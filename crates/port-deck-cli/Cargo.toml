[package]
name = "port-deck-cli"
version = "0.2.1"
edition = "2024"

[[bin]]
name = "strayd"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
directories = "6.0.0"
iana-time-zone = "0.1"
port-deck-core = { path = "../port-deck-core" }
port-deck-engine = { path = "../port-deck-engine" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
thiserror = "2"
toml = "1.1.5"
unicode-width = "0.2.2"
