[package]
name = "strayd-test-support"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23.1"
assert_cmd = "2"
clap = { version = "4.6", features = ["derive"] }
port-deck-core = { path = "../port-deck-core" }
port-deck-engine = { path = "../port-deck-engine" }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
tempfile = "3"
vt100 = "0.15"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

[[bin]]
name = "fixture-process"
path = "src/bin/fixture-process.rs"

[[bin]]
name = "strayd-test-runner"
path = "src/bin/strayd-test-runner.rs"
