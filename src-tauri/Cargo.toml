[package]
name = "port-deck"
version = "0.1.0"
description = "Windows tray manager for local and WSL development resources"
authors = ["Port Deck contributors"]
edition = "2024"

[lib]
name = "port_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
port-deck-engine = { path = "../crates/port-deck-engine" }
tauri = { version = "2", features = ["tray-icon"] }
