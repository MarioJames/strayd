name: Test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.13'
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun test tests/release.test.ts
      - run: bun scripts/ci-native.ts scripts/test-env.ts run --suite native,tui,runtime-smoke,faults,replay --run ci-native
      - run: bun scripts/ci-native.ts test tests/runner.test.ts
      - name: Independent cleanup
        if: always()
        run: bun scripts/test-env.ts cleanup --run ci-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-${{ matrix.os }}
          path: .test-env/runs/
          include-hidden-files: true
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bunx --no-install agent-browser install
      - run: cargo build --locked -p port-deck-cli -p strayd-test-support
      - run: bun scripts/browser-check.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-terminal
          path: .test-env/
          include-hidden-files: true
